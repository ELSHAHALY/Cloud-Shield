# Keeps SHA-pinned actions and Terraform providers current, so pinning does
# not turn into "pinned to something vulnerable forever".
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: terraform
    directories:
      - /infra/terraform/bootstrap
      - /infra/terraform/environments/dev
      - /infra/terraform/modules/*
    schedule:
      interval: weekly

  # Phase E: the three app packages. Exact versions + committed lockfiles
  # (.npmrc save-exact, ignore-scripts); Dependabot proposes the bumps.
  - package-ecosystem: npm
    directories:
      - /app/docs-api
      - /app/spa
      - /app/local-dev
    schedule:
      interval: weekly
    groups:
      aws-sdk:
        patterns: ["@aws-sdk/*"]
      dev-tooling:
        dependency-type: development

  # Digest-pinned base images (FROM ...@sha256) in the app Dockerfiles.
  - package-ecosystem: docker
    directories:
      - /app/docs-api
      - /app/spa
      - /app/local-dev
    schedule:
      interval: weekly

  # moto in docker-compose.local.yml.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
