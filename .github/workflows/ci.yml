# CloudShield — DevSecOps security gates (plan §5, Figure 5.1)
#
# Order is cheapest/fastest first: secrets -> SAST -> SCA -> IaC -> image -> DAST.
#
# FAIL-OPEN vs ENFORCED
#   Repository variable ENFORCE_GATES (Settings -> Secrets and variables ->
#   Actions -> Variables):
#     unset / anything else  -> gates run, findings raise a warning + summary,
#                               the job stays green (bootstrap period).
#     "true"                 -> any finding fails the job (hard gate, FR-5).
#   Flip it to "true" once the first module and the app skeleton are clean,
#   then make every gate job a required status check in branch protection.
#
# Supply chain: third-party actions are pinned to full commit SHAs (tag kept
# in a comment for Dependabot). Scanner versions are pinned explicitly.

name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.16.5"
  GITLEAKS_VERSION: "8.30.1"
  SEMGREP_VERSION: "1.180.0"
  TRIVY_IMAGE: "aquasec/trivy:0.75.0"
  CHECKOV_VERSION: "3.3.26"
  APP_DIR: ${{ vars.APP_DIR || 'app/docs-api' }}
  # Phase E D2: the docs-api image is built with context app/ so the contract
  # (app/openapi.yaml) and the GRC data are inside it.
  IMAGE_CONTEXT: ${{ vars.IMAGE_CONTEXT || 'app' }}
  # Not covered by Dependabot (env values / service images): bump by hand with
  # the compose and Dockerfile pins (audit E12).
  HADOLINT_IMAGE: "hadolint/hadolint:v2.14.0@sha256:27086352fd5e1907ea2b934eb1023f217c5ae087992eb59fde121dce9c9ff21e"

jobs:
  # ---------------------------------------------------------------------------
  # Gate 1 — Secrets (Gitleaks, FULL history). Prevents T1552 at source.
  # ---------------------------------------------------------------------------
  secrets:
    name: "gate: secrets (gitleaks)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The scan's REAL outcome ('success' / 'failure'), even in fail-open mode
    # where the job itself stays green. The image push requires 'success'.
    outputs:
      scan: ${{ steps.scan.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0            # full history: a secret deleted later is still leaked
          persist-credentials: false

      - name: Install gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks version

      - name: Scan full git history
        id: scan
        continue-on-error: ${{ vars.ENFORCE_GATES != 'true' }}
        run: /tmp/gitleaks git . --redact --verbose --exit-code 1

      - name: Report (fail-open)
        if: steps.scan.outcome == 'failure'
        run: |
          echo "::warning title=Secrets gate::Gitleaks found secrets. Not blocking only because ENFORCE_GATES != true. Rotate the credential FIRST, then purge history."
          echo "### ⚠️ Secrets gate failed (fail-open mode)" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Gate 2 — SAST (Semgrep). OWASP A01/A03.
  # ---------------------------------------------------------------------------
  sast:
    name: "gate: sast (semgrep)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      scan: ${{ steps.scan.outcome }}   # real outcome; see the secrets job
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install semgrep
        run: python3 -m pip install --quiet "semgrep==${SEMGREP_VERSION}"

      - name: Semgrep (ERROR severity fails)
        id: scan
        continue-on-error: ${{ vars.ENFORCE_GATES != 'true' }}
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/nodejs \
            --config p/python \
            --config p/typescript \
            --config p/react \
            --severity ERROR \
            --error \
            --metrics off \
            --exclude infra/ --exclude docs/

      - name: Report (fail-open)
        if: steps.scan.outcome == 'failure'
        run: |
          echo "::warning title=SAST gate::Semgrep ERROR-severity findings. Not blocking only because ENFORCE_GATES != true."
          echo "### ⚠️ SAST gate failed (fail-open mode)" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Gate 3 — SCA (Trivy fs over lockfiles). OWASP A06.
  # ---------------------------------------------------------------------------
  sca:
    name: "gate: sca (trivy fs)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      scan: ${{ steps.scan.outcome }}   # real outcome; see the secrets job
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trivy filesystem scan (fixable CRITICAL fails)
        id: scan
        continue-on-error: ${{ vars.ENFORCE_GATES != 'true' }}
        run: |
          docker run --rm -v "$PWD:/src:ro" "$TRIVY_IMAGE" fs \
            --scanners vuln \
            --severity CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --skip-dirs /src/infra \
            /src

      - name: Report (fail-open)
        if: steps.scan.outcome == 'failure'
        run: |
          echo "::warning title=SCA gate::Fixable CRITICAL dependency CVEs. Not blocking only because ENFORCE_GATES != true."
          echo "### ⚠️ SCA gate failed (fail-open mode)" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # SOAR code (soar/) — lint + unit tests (moto, no AWS credentials). Like
  # terraform fmt/validate this is a correctness check, so it always
  # hard-fails, even in fail-open mode: a broken safety guard must never merge.
  # ---------------------------------------------------------------------------
  soar:
    name: "gate: soar (ruff + pytest)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: soar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13" # = Lambda runtime in modules/soar/playbooks.tf

      - name: Install test toolchain
        run: python -m pip install --quiet -r requirements-dev.txt

      - name: ruff
        run: |
          ruff check . ../scripts/package_soar.py
          ruff format --check . ../scripts/package_soar.py

      - name: pytest (coverage gate in pyproject.toml, 95 %)
        run: python -m pytest --cov

      - name: Deterministic package builds
        working-directory: .
        run: python scripts/package_soar.py --out build/soar-playbooks.zip

      # Phase E D17: docs-api triages from a JSON export of core/attack.py.
      - name: ATT&CK table export in sync with docs-api
        run: python -m tools.export_attack_table --check ../app/docs-api/src/soc/attack-table.generated.json

  # ---------------------------------------------------------------------------
  # App (Phase E D27): docs-api (Jest against a moto service), SPA (Vitest,
  # vite build), local-dev tooling, OpenAPI/type drift, Dockerfile lint and the
  # compose file. A correctness gate like `soar`: it always hard-fails.
  # ---------------------------------------------------------------------------
  app:
    name: "gate: app (lint + typecheck + test + build)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      moto:
        image: motoserver/moto:5.2.4@sha256:120b1589c6df7e35d2092935f6ff724486bb2c4189d0e36ce795baba1400ffd2
        ports:
          - 5000:5000
        options: >-
          --health-cmd "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/moto-api/')\""
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      MOTO_ENDPOINT: http://localhost:5000
      AWS_ACCESS_KEY_ID: local-only
      AWS_SECRET_ACCESS_KEY: local-only
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: |
            app/docs-api/package-lock.json
            app/spa/package-lock.json
            app/local-dev/package-lock.json

      - name: "docs-api: install, lint, typecheck, OpenAPI drift"
        working-directory: app/docs-api
        run: |
          npm ci --ignore-scripts
          npm run lint -- --max-warnings 0
          npm run typecheck
          npm run openapi:check

      - name: "docs-api: Jest (moto) with coverage gate"
        working-directory: app/docs-api
        run: npx jest --coverage --ci

      - name: "spa: install, lint, typecheck, Vitest with coverage"
        working-directory: app/spa
        run: |
          npm ci --ignore-scripts
          npm run lint
          npm run typecheck
          npx vitest run --coverage

      - name: "spa: production build without the local auth branch"
        working-directory: app/spa
        env:
          VITE_AUTH_MODE: cognito
          VITE_COGNITO_USER_POOL_ID: us-east-1_Placeholder
          VITE_COGNITO_CLIENT_ID: placeholderclientid
          VITE_AWS_REGION: us-east-1
        run: |
          npm run build
          node scripts/check-bundle.mjs dist
          ! grep -R "local-idp" dist/

      - name: "local-dev: install, lint, typecheck, test"
        working-directory: app/local-dev
        run: |
          npm ci --ignore-scripts
          npm run lint
          npm run typecheck
          npx jest --ci

      - name: hadolint (all Dockerfiles)
        run: |
          for f in app/docs-api/Dockerfile app/spa/Dockerfile app/local-dev/Dockerfile; do
            echo "== $f"
            docker run --rm -i -v "$PWD:/w:ro" -w /w "$HADOLINT_IMAGE" hadolint --config /w/.hadolint.yaml "$f"
          done

      - name: docker compose config
        run: docker compose -f docker-compose.local.yml config -q

  # ---------------------------------------------------------------------------
  # Gate 4 — IaC (terraform fmt/validate + Checkov).
  # ---------------------------------------------------------------------------
  iac:
    name: "gate: iac (terraform + checkov)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # fmt/validate are correctness checks, not security findings: they always
      # hard-fail, even in fail-open mode. Broken HCL should never merge.
      - name: terraform fmt
        run: terraform fmt -check -recursive -diff infra/terraform

      # Every root AND every module: a module no environment calls yet would
      # otherwise never be validated.
      - name: terraform validate (every root and module)
        run: |
          set -euo pipefail
          for dir in infra/terraform/bootstrap infra/terraform/environments/*/ infra/terraform/modules/*/; do
            echo "::group::validate $dir"
            terraform -chdir="$dir" init -backend=false -input=false -no-color
            terraform -chdir="$dir" validate -no-color
            echo "::endgroup::"
          done

      # Offline unit tests with a mocked AWS provider: feature flags default
      # off, dry-run on, digest-pinned images, IMDSv2, guard-before-playbook.
      - name: terraform test (modules with tests/)
        run: |
          set -euo pipefail
          for dir in infra/terraform/modules/*/; do
            [ -d "${dir}tests" ] || continue
            echo "::group::test $dir"
            terraform -chdir="$dir" test -no-color
            echo "::endgroup::"
          done

      - name: Install checkov
        run: python3 -m pip install --quiet "checkov==${CHECKOV_VERSION}"

      # Note: open-source Checkov has no severity data without a Prisma API
      # key, so "fail on HIGH" (plan §5) is implemented as "fail on any failed
      # check"; accepted exceptions are inline `#checkov:skip=ID:reason`.
      - name: Checkov
        id: scan
        continue-on-error: ${{ vars.ENFORCE_GATES != 'true' }}
        run: |
          checkov -d infra/terraform \
            --framework terraform \
            --quiet --compact \
            --download-external-modules false
          # Phase E: the app Dockerfiles (same fail-open step).
          checkov -d app --framework dockerfile --quiet --compact

      - name: Report (fail-open)
        if: steps.scan.outcome == 'failure'
        run: |
          echo "::warning title=IaC gate::Checkov failed checks. Not blocking only because ENFORCE_GATES != true."
          echo "### ⚠️ IaC gate failed (fail-open mode)" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Gate 5 — Image (build + Trivy image + CycloneDX SBOM). Skips until a
  # Dockerfile exists in $APP_DIR.
  # ---------------------------------------------------------------------------
  image:
    name: "gate: image (trivy image + sbom)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [secrets, sast, sca, app]
    permissions:
      contents: read
      id-token: write   # OIDC for the ECR push role (main only); scoped to this job
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect Dockerfile
        id: detect
        run: |
          if [ -f "$APP_DIR/Dockerfile" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No $APP_DIR/Dockerfile yet — image gate skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build image
        if: steps.detect.outputs.present == 'true'
        # Build args are the REAL gate outcomes, baked into build-info.json
        # (plan D18); the image cannot contain its own Trivy result.
        env:
          GATE_SECRETS: ${{ needs.secrets.outputs.scan }}
          GATE_SAST: ${{ needs.sast.outputs.scan }}
          GATE_SCA: ${{ needs.sca.outputs.scan }}
          GATE_APP: ${{ needs.app.result }}
          GATES_ENFORCED: ${{ vars.ENFORCE_GATES == 'true' }}
        run: |
          docker build --pull --platform linux/amd64 \
            -f "$APP_DIR/Dockerfile" \
            --build-arg GIT_SHA="$GITHUB_SHA" \
            --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg CI_RUN_ID="$GITHUB_RUN_ID" \
            --build-arg GATE_SECRETS="$GATE_SECRETS" \
            --build-arg GATE_SAST="$GATE_SAST" \
            --build-arg GATE_SCA="$GATE_SCA" \
            --build-arg GATE_APP="$GATE_APP" \
            --build-arg GATES_ENFORCED="$GATES_ENFORCED" \
            -t "cloudshield/app:${GITHUB_SHA}" "$IMAGE_CONTEXT"

      - name: Trivy image scan (fixable CRITICAL/HIGH fails)
        id: scan
        if: steps.detect.outputs.present == 'true'
        continue-on-error: ${{ vars.ENFORCE_GATES != 'true' }}
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            "cloudshield/app:${GITHUB_SHA}"

      - name: Generate SBOM (CycloneDX)
        if: steps.detect.outputs.present == 'true'
        run: |
          mkdir -p sbom
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/sbom:/out" "$TRIVY_IMAGE" image \
            --format cyclonedx --output /out/sbom.cdx.json "cloudshield/app:${GITHUB_SHA}"

      - name: Upload SBOM
        if: steps.detect.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ github.sha }}
          path: sbom/sbom.cdx.json
          retention-days: 90

      - name: Report (fail-open)
        if: steps.scan.outcome == 'failure'
        run: |
          echo "::warning title=Image gate::Fixable CRITICAL/HIGH image CVEs. Not blocking only because ENFORCE_GATES != true."
          echo "### ⚠️ Image gate failed (fail-open mode)" >> "$GITHUB_STEP_SUMMARY"

      # Push (decision D7, F13/F14): only on a push to main, only once the push
      # role exists (vars.AWS_ECR_PUSH_ROLE_ARN), and only when EVERY gate
      # really passed (audit A9): this job's Trivy scan AND the secrets, SAST
      # and SCA scans (their jobs export the scan step's outcome). A step's
      # outcome is 'failure' whenever findings exist, even in fail-open mode
      # (continue-on-error only keeps the job green), so a failed or skipped
      # scan can never be pushed. The SAME local image that was scanned is
      # pushed; ECR is IMMUTABLE, so an existing tag is left alone. CI pushes
      # only: deploying (by digest) stays a local S1 apply.
      - name: Configure AWS credentials (ECR push role, main only)
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          vars.AWS_ECR_PUSH_ROLE_ARN != '' &&
          steps.detect.outputs.present == 'true' && steps.scan.outcome == 'success' &&
          needs.secrets.outputs.scan == 'success' &&
          needs.sast.outputs.scan == 'success' &&
          needs.sca.outputs.scan == 'success' &&
          needs.app.result == 'success'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-session-name: gha-ecr-push-${{ github.run_id }}

      - name: Push scanned image (main only)
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          vars.AWS_ECR_PUSH_ROLE_ARN != '' &&
          steps.detect.outputs.present == 'true' && steps.scan.outcome == 'success' &&
          needs.secrets.outputs.scan == 'success' &&
          needs.sast.outputs.scan == 'success' &&
          needs.sca.outputs.scan == 'success' &&
          needs.app.result == 'success'
        env:
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          set -euo pipefail
          # ECR_REPOSITORY = terraform output ecr_repository_url
          #   (<acct>.dkr.ecr.<region>.amazonaws.com/<name>/docs-api)
          registry="${ECR_REPOSITORY%%/*}"
          repo_name="${ECR_REPOSITORY#*/}"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$registry"

          if aws ecr describe-images --repository-name "$repo_name" \
               --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            echo "Tag ${GITHUB_SHA} already in ECR (immutable): not pushing again."
          else
            docker tag "cloudshield/app:${GITHUB_SHA}" "${ECR_REPOSITORY}:${GITHUB_SHA}"
            docker push "${ECR_REPOSITORY}:${GITHUB_SHA}"
          fi
          docker logout "$registry"

          aws ecr wait image-scan-complete --repository-name "$repo_name" \
            --image-id imageTag="$GITHUB_SHA"
          digest="$(aws ecr describe-images --repository-name "$repo_name" \
            --image-ids imageTag="$GITHUB_SHA" \
            --query 'imageDetails[0].imageDigest' --output text)"
          {
            echo "### Image pushed to ECR"
            echo "Deploy by digest (container_image):"
            echo '```'
            echo "${ECR_REPOSITORY}@${digest}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Local stack smoke (Phase E §11.7). Not a required check at first: builds the
  # compose stack (moto, local IdP, seed, docs-api, SPA) and runs the 8
  # end-to-end checks (five groups) of plan §14.
  # ---------------------------------------------------------------------------
  app-smoke:
    name: "app-smoke (docker compose, optional)"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [app]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/local-dev/package-lock.json

      - name: Build and start the local stack
        run: make local-up

      - name: Smoke checks
        run: make local-smoke

      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.local.yml logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: make local-down

  # ---------------------------------------------------------------------------
  # Terraform plan via OIDC (read-only role). Runs only once bootstrap is done
  # and the repo variables below are set, and never for fork PRs.
  # ---------------------------------------------------------------------------
  terraform-plan:
    name: "terraform plan (dev)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [iac]
    if: >-
      vars.AWS_PLAN_ROLE_ARN != '' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      id-token: write   # required for OIDC; scoped to this job only
    defaults:
      run:
        working-directory: infra/terraform/environments/dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-session-name: gha-plan-${{ github.run_id }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_KMS_KEY_ARN: ${{ vars.TF_STATE_KMS_KEY_ARN }}
          TF_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=dev/terraform.tfstate" \
            -backend-config="region=${TF_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="kms_key_id=${TF_STATE_KMS_KEY_ARN}" \
            -backend-config="use_lockfile=true"

      - name: terraform plan
        run: |
          set -o pipefail
          terraform plan -input=false -lock-timeout=60s -no-color | tee plan.txt
          {
            echo "### terraform plan (dev)"
            echo '```'
            tail -n 40 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Gate 6 — DAST (OWASP ZAP baseline) against staging. Runs only on main /
  # manual dispatch, and only once vars.STAGING_URL is set.
  # ---------------------------------------------------------------------------
  dast:
    name: "gate: dast (zap baseline)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [image]
    if: vars.STAGING_URL != '' && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # -I: only rules set to FAIL in .zap/rules.tsv break the build.
      # Rules marked FAIL in .zap/rules.tsv break the build (security headers).
      # -m 1: one-minute spider, so the scan stays under the CloudFront WAF
      # per-IP rate limit; CI gets no WAF allow-list (Phase D §6).
      - name: ZAP baseline
        id: scan
        continue-on-error: ${{ vars.ENFORCE_GATES != 'true' }}
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |
          mkdir -p zap && cp .zap/rules.tsv zap/ && chmod -R 777 zap
          docker run --rm -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t "$STAGING_URL" -c rules.tsv -I -m 1 -r zap-report.html

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-report-${{ github.sha }}
          path: zap/zap-report.html
          if-no-files-found: ignore

      - name: Report (fail-open)
        if: steps.scan.outcome == 'failure'
        run: |
          echo "::warning title=DAST gate::ZAP FAIL-level alerts. Not blocking only because ENFORCE_GATES != true."
          echo "### ⚠️ DAST gate failed (fail-open mode)" >> "$GITHUB_STEP_SUMMARY"
