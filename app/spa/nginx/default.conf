# Local stand-in for CloudFront + API Gateway (plan §10). Same security
# headers the ZAP gate checks; /api/ is stripped like API Gateway does, and
# CloudFront-Viewer-Address is OVERWRITTEN with the TCP peer, so a client can
# never choose the IP that docs-api audits or publishes.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 6m;

    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://docs-api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header CloudFront-Viewer-Address "$remote_addr:$remote_port";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Origin-Verify "";
        proxy_read_timeout 29s;
    }

    location /local-idp/ {
        proxy_pass http://local-idp:9000/;
        proxy_http_version 1.1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
